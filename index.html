<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shadow Fight 2: Solo Leveling - Shadow Skill Edition</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body {
            background-color: #030308;
            color: #fff;
            font-family: 'Cinzel', 'Georgia', serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }

        #game-container {
            position: relative;
            width: 960px;
            height: 540px;
            border: 3px solid #1a1a2e;
            box-shadow: 0 0 40px rgba(0, 210, 255, 0.25), 0 0 100px rgba(0, 0, 0, 0.9);
            background: #000;
            overflow: hidden;
        }

        canvas { display: block; }

        .overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(4, 5, 12, 0.95);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 10;
        }

        h1.title {
            font-size: 42px;
            color: #00d2ff;
            text-shadow: 0 0 20px #00d2ff, 0 0 40px #0055ff;
            letter-spacing: 5px;
            margin-bottom: 5px;
            text-transform: uppercase;
            text-align: center;
        }

        .subtitle {
            font-size: 15px;
            color: #eccc68;
            letter-spacing: 3px;
            margin-bottom: 25px;
            text-shadow: 0 0 10px rgba(236, 204, 104, 0.5);
            text-align: center;
        }

        .login-box {
            background: rgba(15, 15, 25, 0.9);
            border: 2px solid #00d2ff;
            padding: 30px;
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            box-shadow: 0 0 30px rgba(0, 210, 255, 0.3);
            width: 320px;
        }

        .input-field {
            width: 100%;
            padding: 12px;
            background: #080810;
            border: 1px solid #00d2ff;
            color: #fff;
            border-radius: 4px;
            outline: none;
            font-size: 14px;
            text-align: center;
        }

        .btn {
            background: linear-gradient(180deg, #00d2ff, #0055ff);
            color: #000;
            font-weight: bold;
            border: none;
            padding: 12px 25px;
            font-size: 16px;
            font-family: inherit;
            cursor: pointer;
            border-radius: 4px;
            transition: all 0.2s;
            box-shadow: 0 0 15px rgba(0, 210, 255, 0.6);
            min-width: 180px;
            text-align: center;
        }

        .btn-retry {
            background: linear-gradient(180deg, #ff4757, #ff0055);
            color: #fff;
            box-shadow: 0 0 15px rgba(255, 0, 85, 0.6);
        }

        .btn:hover {
            transform: scale(1.05);
            background: linear-gradient(180deg, #eccc68, #ff9f1a);
            color: #000;
            box-shadow: 0 0 25px rgba(236, 204, 104, 0.8);
        }

        #hud {
            position: absolute;
            top: 15px; left: 0; width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            padding: 0 30px;
            z-index: 5;
            pointer-events: none;
        }

        .hud-side { width: 380px; }
        .hp-bar-container {
            background: rgba(0, 0, 0, 0.8);
            border: 2px solid #333;
            height: 24px;
            position: relative;
            border-radius: 3px;
            overflow: hidden;
            box-shadow: 0 0 10px rgba(0,0,0,0.8);
        }
        .hp-bar-fill { height: 100%; width: 100%; transition: width 0.1s ease-out; }
        #player-hp { background: linear-gradient(90deg, #00d2ff, #0055ff); }
        #enemy-hp { background: linear-gradient(90deg, #ff0055, #ff4757); float: right; }

        .mana-bar-container {
            background: rgba(0, 0, 0, 0.8);
            border: 1px solid #222;
            height: 8px;
            margin-top: 4px;
            border-radius: 2px;
            overflow: hidden;
        }
        #player-mana { height: 100%; width: 100%; background: #eccc68; transition: width 0.1s; }

        .fighter-info {
            display: flex;
            justify-content: space-between;
            font-size: 13px;
            font-weight: bold;
            margin-bottom: 4px;
            color: #ccc;
        }

        #skill-display {
            position: absolute;
            bottom: 20px;
            left: 30px;
            color: #00d2ff;
            font-size: 14px;
            font-weight: bold;
            text-shadow: 0 0 10px rgba(0, 210, 255, 0.6);
            z-index: 5;
            display: none;
        }

        #combo-counter {
            position: absolute;
            top: 90px; left: 40px;
            font-size: 32px;
            font-weight: bold;
            color: #eccc68;
            text-shadow: 0 0 15px #eccc68;
            opacity: 0;
            transition: opacity 0.2s;
        }

        .quiz-box {
            background: #080812;
            border: 2px solid #00d2ff;
            border-radius: 8px;
            padding: 25px;
            width: 80%;
            text-align: center;
            box-shadow: 0 0 30px rgba(0, 210, 255, 0.5);
        }

        .quiz-category { color: #eccc68; font-size: 14px; letter-spacing: 2px; margin-bottom: 10px; }
        .quiz-question { font-size: 20px; margin-bottom: 20px; font-weight: bold; line-height: 1.4; }
        .options-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }

        .btn-option {
            background: #101020;
            color: #fff;
            border: 1px solid #333;
            padding: 14px;
            font-size: 15px;
            cursor: pointer;
            border-radius: 4px;
            transition: 0.2s;
        }
        .btn-option:hover { background: #00d2ff; color: #000; font-weight: bold; box-shadow: 0 0 15px #00d2ff; }

        #controls-hint {
            margin-top: 12px;
            color: #777;
            font-size: 13px;
        }
    </style>
</head>
<body>

    <div id="game-container">
        <canvas id="gameCanvas" width="960" height="540"></canvas>

        <div id="combo-counter">0 COMBO!</div>
        <div id="skill-display">SKILL MANA LENGKAP [L]: SHADOW ARMY (ARISE)</div>

        <!-- HUD PERTARUNGAN -->
        <div id="hud" style="display: none;">
            <div class="hud-side">
                <div class="fighter-info">
                    <span id="player-name-hud">HUNTER</span>
                    <span id="player-rank-hud">E-RANK</span>
                </div>
                <div class="hp-bar-container">
                    <div id="player-hp" class="hp-bar-fill"></div>
                </div>
                <div class="mana-bar-container">
                    <div id="player-mana"></div>
                </div>
            </div>

            <div style="text-align: center;">
                <div id="match-title" style="color: #eccc68; font-weight: bold; font-size: 18px;">STAGE 1</div>
                <div style="color: #ff0055; font-size: 11px; letter-spacing: 1px;">CRITICAL SYSTEM</div>
            </div>

            <div class="hud-side">
                <div class="fighter-info" style="justify-content: flex-end;">
                    <span id="enemy-name-hud">TRAINING STICKMAN</span>
                </div>
                <div class="hp-bar-container">
                    <div id="enemy-hp" class="hp-bar-fill"></div>
                </div>
            </div>
        </div>

        <!-- LAYAR LOGIN -->
        <div id="login-overlay" class="overlay">
            <h1 class="title">SHADOW FIGHT 2</h1>
            <div class="subtitle">SOLO LEVELING: SHADOW EXTRACTION</div>
            <div class="login-box">
                <input type="text" id="player-name-input" class="input-field" placeholder="MASUKKAN NAMA HUNTER" value="Sung Jin-Woo">
                <button id="btn-start" class="btn">BANGKIT (ARISE)</button>
                <div id="controls-hint">Kontrol: [A][D] Bergerak | [K] Serang | [L] Skill</div>
            </div>
        </div>

        <!-- LAYAR KUIS TACTICAL -->
        <div id="quiz-overlay" class="overlay" style="display: none;">
            <div class="quiz-box">
                <div id="q-category" class="quiz-category">CATEGORY</div>
                <div id="q-question" class="quiz-question">Pertanyaan kuis?</div>
                <div id="q-options" class="options-grid"></div>
            </div>
        </div>

        <!-- LAYAR SELESAI -->
        <div id="end-overlay" class="overlay" style="display: none;">
            <h1 id="end-title" class="title">GAME OVER</h1>
            <div id="end-subtitle" class="subtitle">Kekuatan Anda belum mencukupi.</div>
            <button id="btn-restart" class="btn btn-retry">COBA LAGI</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        let gameActive = false;
        let currentStage = 1;
        let comboCount = 0;
        let comboTimer = null;
        let quizTriggeredInThisStage = false;

        let activeSkillShadows = []; 
        let activeParticles = [];

        const stageQuizzes = {
            1: [
                { q: "Berapakah hasil dari 12 x 4 - (15 + 5)?", cat: "STAGE 1: MATEMATIKA DASAR", o: ["28", "38", "18", "48"], a: 0 },
